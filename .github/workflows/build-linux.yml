name: Build (Linux)

# Build QuickViewer for Linux (GCC / x86_64) on every push.
# See HowToBuild.md for the manual build procedure this workflow automates.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/FUNDING.yml'
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.9.1'
  QT_ARCH: 'linux_gcc_64'

jobs:
  build:
    name: Linux x86_64 (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Only the submodules actually referenced by QVproject.pro's SUBDIRS are
      # initialized; exiv2 / libexpat / quazip / zlib are not part of the build.
      - name: Init submodules
        run: |
          git submodule update --init --recursive \
            Qt7z/Qt7z/lib7zip \
            ResizeHalf/ResizeHalf \
            easyexif/easyexif \
            zimg/zimg \
            qsvgrenderer/svg-native-viewer \
            luminor/luminor \
            QuickViewer/src/qactionmanager \
            QuickViewer/src/qfullscreenframe \
            QuickViewer/src/qlanguageselector \
            QuickViewer/src/qnamedpipe

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gdb \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libfontconfig1-dev \
            libfreetype-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: 'qtimageformats'
          cache: true

      - name: Run qmake
        run: |
          mkdir build
          cd build
          qmake -o Makefile -recursive CONFIG+=release CONFIG+=force_debug_info ../QVproject.pro

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      # lib7zip loads "7z.so" at runtime and, when it is not beside the
      # executable or cannot be loaded, silently falls back to system
      # directories such as /usr/lib/7zip. The runner has the distro 7-Zip
      # there, which is not ABI compatible with the vendored p7zip 17.04 that
      # lib7zip is built against, and it crashes on the first archive access.
      #
      # Build 7z.so with p7zip's own makefile, as the AppImage release did.
      # Qt7z/lib7z/lib7z.pro is not used: it predates the p7zip fork now in
      # the tree and misses XzDecoder/XzEncoder/LzfseDecoder, so its 7z.so has
      # undefined symbols and fails to load.
      - name: Build 7z.so
        run: |
          make -C Qt7z/Qt7z/p7zip -j$(nproc) common7z
          cp Qt7z/Qt7z/p7zip/bin/7z.so build/bin/7z.so
          # Fail here rather than let lib7zip fall back to the system 7z.so.
          python3 -c 'import ctypes; ctypes.CDLL("build/bin/7z.so"); print("7z.so loads")'

      - name: Run tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: |
          # Diagnostics for the crash in FileLoaderTest: print the backtrace and
          # which 7z.so was actually loaded. The plain run below sets the result.
          gdb -batch -ex 'set debuginfod enabled off' -ex run -ex bt \
            -ex 'info sharedlibrary' --args ./bin/tst_fileloadertest || true
          ./bin/tst_fileloadertest

      # `make install` is not used here: the AppImage target needs linuxdeployqt
      # and appimagetool. The build output is packed as-is instead.
      - name: Package
        run: |
          dist=dist
          mkdir -p "$dist/bin" "$dist/lib" "$dist/translations" "$dist/database"
          cp build/bin/QuickViewer build/bin/7z.so "$dist/bin"
          cp -a build/lib/*.so* "$dist/lib"
          cp QuickViewer/translations/*.qm QuickViewer/translations/languages.ini "$dist/translations"
          cp QuickViewer/database/schema.sql QuickViewer/database/thumbnail.sqlite3.db "$dist/database"
          cp README.md LICENSE QuickViewer/QuickViewer.desktop "$dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickViewer-linux-x86_64
          path: dist/
          if-no-files-found: error
