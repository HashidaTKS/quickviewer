name: Build (Linux)

# Build QuickViewer for Linux (GCC / x86_64) on every push.
# See HowToBuild.md for the manual build procedure this workflow automates.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/FUNDING.yml'
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.9.1'
  QT_ARCH: 'linux_gcc_64'

jobs:
  build:
    name: Linux x86_64 (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Only the submodules actually referenced by QVproject.pro's SUBDIRS are
      # initialized; exiv2 / libexpat / quazip / zlib are not part of the build.
      - name: Init submodules
        run: |
          git submodule update --init --recursive \
            Qt7z/Qt7z/lib7zip \
            ResizeHalf/ResizeHalf \
            easyexif/easyexif \
            zimg/zimg \
            qsvgrenderer/svg-native-viewer \
            luminor/luminor \
            QuickViewer/src/qactionmanager \
            QuickViewer/src/qfullscreenframe \
            QuickViewer/src/qlanguageselector \
            QuickViewer/src/qnamedpipe

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gdb \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: 'qtimageformats'
          cache: true

      - name: Run qmake
        run: |
          mkdir build
          cd build
          qmake -o Makefile -recursive CONFIG+=release CONFIG+=force_debug_info ../QVproject.pro

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      # lib7zip loads "7z.so" at runtime and, when it is not beside the
      # executable or cannot be loaded, silently falls back to system
      # directories such as /usr/lib/7zip. The runner has the distro 7-Zip
      # there, which is not ABI compatible with the vendored p7zip 17.04 that
      # lib7zip is built against, and it crashes on the first archive access.
      #
      # Build 7z.so with p7zip's own makefile, as the AppImage release did.
      # Qt7z/lib7z/lib7z.pro is not used: it predates the p7zip fork now in
      # the tree and misses XzDecoder/XzEncoder/LzfseDecoder, so its 7z.so has
      # undefined symbols and fails to load.
      - name: Build 7z.so
        run: |
          make -C Qt7z/Qt7z/p7zip -j$(nproc) common7z
          cp Qt7z/Qt7z/p7zip/bin/7z.so build/bin/7z.so
          # Fail here rather than let lib7zip fall back to the system 7z.so.
          python3 -c 'import ctypes; ctypes.CDLL("build/bin/7z.so"); print("7z.so loads")'

      - name: Run tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: |
          # Diagnostics for the crash in FileLoaderTest: print the backtrace and
          # which 7z.so was actually loaded. The plain run below sets the result.
          gdb -batch -ex 'set debuginfod enabled off' -ex run -ex bt \
            -ex 'info sharedlibrary' --args ./bin/tst_fileloadertest || true
          ./bin/tst_fileloadertest

      # Build an AppImage, as the official releases did up to v1.2.2. The author
      # used linuxdeployqt through `make install`, but it is unmaintained and
      # refuses to run on current glibc, so linuxdeploy and its Qt plugin are
      # used instead. The layout follows qt-linux-appimage.conf, which release
      # builds embed as qt.conf: Qt plugins in usr/plugins and translations in
      # <AppDir>/translations. Settings and the catalog database are created in
      # ~/.quickviewer at runtime, so they are not bundled.
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          version=$(sed -n 's/^VERSION *= *//p' QuickViewer/QuickViewer.pro | head -1 | tr -d '\r')
          appdir=QuickViewer.AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/translations"
          # 7z.so must sit beside the real executable, which lib7zip finds
          # through /proc/self/exe, so that it wins over the system 7-Zip.
          cp build/bin/QuickViewer build/bin/7z.so "$appdir/usr/bin"
          cp QuickViewer/translations/*.qm QuickViewer/translations/languages.ini "$appdir/translations"
          sed 's|^Exec=.*|Exec=QuickViewer %F|' QuickViewer/QuickViewer.desktop > quickviewer.desktop
          cp docs/quickviewer.png quickviewer.png

          # The same drivers the author excluded from linuxdeployqt: their
          # client libraries are not available, so deploying them fails.
          rm -f "$QT_ROOT_DIR"/plugins/sqldrivers/libqsql{mimer,mysql,odbc,psql}.so

          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

          export PATH="$PWD:$PATH"
          export LD_LIBRARY_PATH="$PWD/build/lib:$QT_ROOT_DIR/lib"
          export QMAKE="$(command -v qmake)"
          export OUTPUT="QuickViewer-${version}-x64.AppImage"
          linuxdeploy-x86_64.AppImage --appdir "$appdir" \
            --executable "$appdir/usr/bin/QuickViewer" \
            --desktop-file quickviewer.desktop \
            --icon-file quickviewer.png \
            --plugin qt \
            --output appimage

      - name: Verify AppImage
        run: |
          image=$(ls QuickViewer-*-x64.AppImage)
          ./"$image" --appimage-extract > /dev/null
          test -f squashfs-root/usr/bin/7z.so
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
          test -f squashfs-root/translations/languages.ini
          if ldd squashfs-root/usr/bin/QuickViewer | grep "not found"; then
            echo "unresolved libraries in the AppImage"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickViewer-linux-x64-AppImage
          path: QuickViewer-*-x64.AppImage
          if-no-files-found: error
